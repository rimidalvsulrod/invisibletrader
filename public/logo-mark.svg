<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e4e7"/></linearGradient>
    <linearGradient id="dip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d4d8"/><stop offset=".55" stop-color="#9a9aa0"/><stop offset="1" stop-color="#6b6b70"/></linearGradient>
  </defs>
  <!-- rounded tile (iOS proportion: corner radius ~22.5%) -->
  <rect width="512" height="512" rx="115" fill="url(#tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
  <!-- the M: centre dip behind, two legs in front -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="94">
    <path stroke="url(#dip)" d="M190 176 256 296 322 176"/>
    <path stroke="url(#leg)" d="M118 318 190 176"/>
    <path stroke="url(#leg)" d="M322 176 394 318"/>
  </g>
</svg>
