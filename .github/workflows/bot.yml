# 24/7 runner for the Auto Trader. Calls the site's /api/cron every ~10 seconds, around the clock.
# A fresh run starts every hour and cancels the previous one (concurrency below), so there is no gap
# even when GitHub's scheduler is late. Public repos get unlimited free Actions minutes.
name: auto-trader
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/bot.yml']
concurrency:
  group: auto-trader
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Check for trades every 10 seconds
        run: |
          end=$((SECONDS + 21300))   # ~5h55m safety stop; normally replaced by the next hourly run first
          while [ $SECONDS -lt $end ]; do
            curl -sS -m 50 -o /dev/null -w "%{http_code} " "https://invisibletrader.vercel.app/api/cron" || true
            sleep 10
          done
