# 24/7 runner for the Auto Trader.
# Each run lasts ~5h50m and starts its own replacement ~10 min before it ends (GitHub's schedule is too unreliable to
# depend on). The hourly schedule is only a watchdog: it starts a runner if none is active. If two ever overlap, the
# older one stops handing over, and the engine's database lock keeps checks one at a time.
#   With the DATABASE_URL secret: runs the engine here, checking every 2 seconds.
#   Without it: calls the site's /api/cron every 10 seconds.
# Public repos get unlimited free Actions minutes.
name: auto-trader
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/bot.yml', 'runner.js', 'api/**', 'package*.json']
permissions:
  actions: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_MINUTES: 350
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      POLYMARKET_US_KEY_ID: ${{ secrets.POLYMARKET_US_KEY_ID }}
      POLYMARKET_US_SECRET_KEY: ${{ secrets.POLYMARKET_US_SECRET_KEY }}
      MAX_ORDER_USD: ${{ secrets.MAX_ORDER_USD }}
      TRADING_DISABLED: ${{ secrets.TRADING_DISABLED }}
    steps:
      - name: Watchdog — skip if a runner is already active
        id: dog
        run: |
          others=$(gh run list -w bot.yml -L 20 --json databaseId,status -q "[.[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }})] | length")
          if [ "${{ github.event_name }}" = schedule ] && [ "$others" != 0 ]; then echo "runner already active"; echo skip=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.dog.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.dog.outputs.skip != '1' && env.DATABASE_URL != ''
        with: { node-version: 22 }
      # Kronos AI bot (optional): the open-source Kronos candlestick model needs Python + PyTorch. Third-party code, so: exact versions, prebuilt wheels only (no install scripts), the Kronos
      # repo at one reviewed commit, and everything installed WITHOUT this job's secrets in the environment. The runner starts the model as a child process with a bare environment too
      # (api/_lib/kronos.js). If any of this fails the step is skipped (KRONOS stays unset) and the runner carries on exactly as before.
      - uses: actions/setup-python@v5
        if: steps.dog.outputs.skip != '1' && env.DATABASE_URL != ''
        with: { python-version: '3.12' }
      - name: Install Kronos (pinned, no secrets)
        if: steps.dog.outputs.skip != '1' && env.DATABASE_URL != ''
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -e
          clean() { env -u DATABASE_URL -u SESSION_SECRET -u POLYMARKET_US_KEY_ID -u POLYMARKET_US_SECRET_KEY -u MAX_ORDER_USD -u TRADING_DISABLED -u GH_TOKEN "$@"; }
          python -m venv "$RUNNER_TEMP/kronos-venv"
          clean "$RUNNER_TEMP/kronos-venv/bin/pip" install --quiet --only-binary=:all: torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          clean "$RUNNER_TEMP/kronos-venv/bin/pip" install --quiet --only-binary=:all: numpy==2.4.6 pandas==3.0.6 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm==4.70.1
          clean git clone --quiet https://github.com/shiyu-coder/Kronos.git "$RUNNER_TEMP/Kronos"
          clean git -C "$RUNNER_TEMP/Kronos" checkout --quiet 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          { echo "KRONOS=1"; echo "KRONOS_PY=$RUNNER_TEMP/kronos-venv/bin/python"; echo "KRONOS_DIR=$RUNNER_TEMP/Kronos"; echo "KRONOS_THREADS=2"; } >> "$GITHUB_ENV"
      - name: Check for trades (every 2s with DATABASE_URL, else every 10s via the site)
        if: steps.dog.outputs.skip != '1'
        run: |
          me=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          ( sleep 45
            for id in $(gh run list -w bot.yml -L 20 --json databaseId,status -q ".[] | select(.status != \"completed\" and .databaseId < ${{ github.run_id }}) | .databaseId"); do
              gh run cancel "$id" && echo "stopped older run $id" || true
            done ) &
          ( sleep $(( (RUN_MINUTES - 10) * 60 ))
            newer=$(gh run list -w bot.yml -L 20 --json status,createdAt -q "[.[] | select(.status != \"completed\" and .createdAt > \"$me\")] | length")
            if [ "$newer" = 0 ]; then gh workflow run bot.yml && echo "handed over to a new run"; else echo "a newer run is active; not handing over"; fi ) &
          if [ -n "$DATABASE_URL" ]; then
            npm ci --omit=dev --no-audit --no-fund && node runner.js
          else
            end=$((SECONDS + RUN_MINUTES * 60))
            while [ $SECONDS -lt $end ]; do
              curl -sS -m 50 -o /dev/null -w "%{http_code} " "https://invisibletrader.vercel.app/api/cron" || true
              sleep 10
            done
          fi
