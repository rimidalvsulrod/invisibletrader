# 24/7 runner for the Auto Trader.
# Each run lasts ~5h50m and starts its own replacement ~10 min before it ends (GitHub's schedule is too unreliable to
# depend on). The hourly schedule is only a watchdog: it starts a runner if none is active. If two ever overlap, the
# older one stops handing over, and the engine's database lock keeps checks one at a time.
#   With the DATABASE_URL secret: runs the engine here, checking every 2 seconds.
#   Without it: calls the site's /api/cron every 10 seconds.
# Public repos get unlimited free Actions minutes.
name: auto-trader
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/bot.yml', 'runner.js', 'api/**', 'package*.json']
permissions:
  actions: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_MINUTES: 350
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      KALSHI_ENV: ${{ secrets.KALSHI_ENV }}
      MAX_ORDER_USD: ${{ secrets.MAX_ORDER_USD }}
      TRADING_DISABLED: ${{ secrets.TRADING_DISABLED }}
    steps:
      - name: Watchdog — skip if a runner is already active
        id: dog
        run: |
          others=$(gh run list -w bot.yml -L 20 --json databaseId,status -q "[.[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }})] | length")
          if [ "${{ github.event_name }}" = schedule ] && [ "$others" != 0 ]; then echo "runner already active"; echo skip=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.dog.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.dog.outputs.skip != '1' && env.DATABASE_URL != ''
        with: { node-version: 22 }
      - name: Check for trades (every 2s with DATABASE_URL, else every 10s via the site)
        if: steps.dog.outputs.skip != '1'
        run: |
          me=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          # new code or hand-over: once this runner is up, stop older ones (they finish their current check first)
          ( sleep 45
            for id in $(gh run list -w bot.yml -L 20 --json databaseId,status -q ".[] | select(.status != \"completed\" and .databaseId < ${{ github.run_id }}) | .databaseId"); do
              gh run cancel "$id" && echo "stopped older run $id" || true
            done ) &
          ( sleep $(( (RUN_MINUTES - 10) * 60 ))
            newer=$(gh run list -w bot.yml -L 20 --json status,createdAt -q "[.[] | select(.status != \"completed\" and .createdAt > \"$me\")] | length")
            if [ "$newer" = 0 ]; then gh workflow run bot.yml && echo "handed over to a new run"; else echo "a newer run is active; not handing over"; fi ) &
          if [ -n "$DATABASE_URL" ]; then
            npm ci --omit=dev --no-audit --no-fund && node runner.js
          else
            end=$((SECONDS + RUN_MINUTES * 60))
            while [ $SECONDS -lt $end ]; do
              curl -sS -m 50 -o /dev/null -w "%{http_code} " "https://invisibletrader.vercel.app/api/cron" || true
              sleep 10
            done
          fi
